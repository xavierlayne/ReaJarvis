# Keep the README's contributor avatar wall current.
#
# A "Thanks to everyone who has shipped something here" list that never updates
# is worse than none: the first person to land a pull request looks for their
# face, does not find it, and reads that as the project not caring. This job
# regenerates the block between the contributors markers once a week and
# commits it only when it actually changed.
#
# It does NOT run as a required check on pull requests. Making a stale wall
# fail CI would turn every new contributor's own arrival into a red X.
#
# Action SHAs are pinned to the same 40-char commits ci.yml already vetted
# (CVE-2025-30066 hardening).

name: Contributors

on:
  workflow_dispatch:

# Read-only by default; the job below asks for the push it makes.
permissions:
  contents: read

concurrency:
  # One constant group, NOT keyed on the ref: every run of this job pushes to
  # main, so a merge-triggered run and the Monday run overlapping would have
  # them racing on the same branch. Serialise instead, and never cancel - a
  # cancelled run silently drops somebody off the wall until the next one.
  group: contributors
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh the avatar wall
    # A closed-but-not-merged pull request adds nobody.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job pushes, so it needs a real branch rather than a detached HEAD.
          ref: main
          # The push token never lands in .git/config: only the commit step
          # below receives it, so nothing else in this job runs beside it.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Regenerate the block
        env:
          # Lifts the contributors API rate limit; no extra scope needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/update_contributors.py

      - name: Commit when it changed
        env:
          # main is protected. GITHUB_TOKEN can never push there; a maintainer
          # token in INTEGRATION_TOKEN (the secret release-cut also reads) can
          # when its owner may bypass the protection.
          PUSH_TOKEN: ${{ secrets.INTEGRATION_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "contributors: nothing changed, no commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "docs(readme): refresh the contributor avatar wall"
          # Someone may have pushed while this ran. Rebase once, then push; a
          # second failure is reported rather than swallowed, so a genuinely
          # broken job is visible instead of quietly skipping every week.
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase --ff-only "$remote" main
          if ! git push "$remote" HEAD:main 2> push.err; then
            cat push.err
            if grep -q "GH006\|protected branch" push.err; then
              # Branch protection, not a broken job: say so once per run
              # instead of a red X on every merged pull request.
              echo "::warning::contributors: main is protected and this token may not push to it; the wall was not refreshed. Set INTEGRATION_TOKEN to a token that may bypass the protection."
              exit 0
            fi
            exit 1
          fi
