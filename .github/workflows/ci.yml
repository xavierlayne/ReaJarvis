name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-build-and-lint:
    name: Python Build & Syntax Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python syntax and bytecode compilation
        run: |
          python -m compileall jarvis/

      - name: Install dependencies (light)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps

      - name: Smoke check core package and version
        run: |
          python -c "import jarvis; print('ReaJarvis version:', jarvis.__version__)"
          python -c "from jarvis.core.turn_language import DEFAULT_LOCALE; print('Default locale:', DEFAULT_LOCALE)"

  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jarvis/ui/web/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jarvis/ui/web/frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend production bundle
        run: npm run build

      - name: Verify build artifacts
        working-directory: jarvis/ui/web/dist
        run: |
          test -f index.html
          echo "Frontend bundle verified successfully."

  windows-build-smoke:
    name: Windows Environment Smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify bytecode compilation on Windows
        run: |
          python -m compileall jarvis/

      - name: Install core package
        run: |
          pip install -e . --no-deps
          python -c "import jarvis; print('Windows smoke check passed. ReaJarvis:', jarvis.__version__)"

  gate:
    name: CI gate
    needs: [python-build-and-lint, frontend-build, windows-build-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CI Gate Evaluation
        run: |
          echo "============================================="
          echo "All ReaJarvis CI pipelines passed cleanly!   "
          echo "Status: SUCCESS                             "
          echo "============================================="
